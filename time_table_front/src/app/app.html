<div class="app-shell">

  <!-- ========= HEADER ========= -->
  <header class="app-header">
    <div class="header-inner">
      <!-- Logo / Branding -->
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <span class="material-symbols-rounded brand-icon">school</span>
        </div>
        <div class="brand-text">
          <span class="brand-name">ระบบตารางสอน</span>
          <span class="brand-sub">สถาบันภาษา</span>
        </div>
      </div>

      <!-- Semester pill -->
      <div class="semester-pill">
        <span class="material-symbols-rounded semester-icon">calendar_today</span>
        <span>ภาคเรียนที่ 1/2567</span>
      </div>
    </div>
  </header>

  <!-- ========= TAB NAVIGATION ========= -->
  <app-tab-nav
    [tabs]="tabs"
    [activeTab]="activeTab()"
    (tabChange)="setTab($event)"
  />

  <!-- ========= MAIN CONTENT ========= -->
  <main class="app-content" role="main">
    @switch (activeTab()) {
      @case (1) {
        <app-tab-course-search />
      }
      @case (2) {
        <app-tab-instructor />
      }
      @case (3) {
        <app-tab-three />
      }
      @case (4) {
        <app-tab-four />
      }
      @case (5) {
        <app-tab-five />
      }
      @case (6) {
        <app-tab-six />
      }
    }
  </main>

</div>

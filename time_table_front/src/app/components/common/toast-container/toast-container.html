<div class="toast-viewport" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="toast-pill-card"
      [class.toast-success]="toast.type === 'success'"
      [class.toast-error]="toast.type === 'error'"
      [class.toast-info]="toast.type === 'info'"
      [class.toast-warning]="toast.type === 'warning'"
      [class.toast-loading]="toast.type === 'loading'"
      (click)="onDismiss(toast)"
    >
      <!-- Left Icon / Spinner -->
      <div class="toast-icon-circle">
        <span class="material-symbols-rounded" [class.spin-loading]="toast.type === 'loading'">
          {{ getIcon(toast.type) }}
        </span>
      </div>

      <!-- Text Content -->
      <div class="toast-body">
        @if (toast.title) {
          <strong class="toast-title">{{ toast.title }}</strong>
        }
        <span class="toast-message">{{ toast.message }}</span>
      </div>

      <!-- Close Button -->
      @if (toast.type !== 'loading') {
        <button class="btn-close-toast" (click)="onDismiss(toast)">
          <span class="material-symbols-rounded">close</span>
        </button>
      }
    </div>
  }
</div>

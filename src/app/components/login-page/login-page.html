<div class="login-page-container">

  <!-- Floating Theme Toggle at Top Right -->
  <div class="login-theme-toggle-wrap">
    <button
      type="button"
      class="topbar-theme-toggle"
      (click)="themeService.toggleTheme()"
      (contextmenu)="themeService.resetToAuto(); $event.preventDefault()"
      [title]="'โหมดธีม: ' + themeService.modeDescription() + ' • คลิกเพื่อสลับโหมด • คลิกขวาเพื่อตรวจจับตามระบบ (Auto)'"
      [attr.aria-label]="themeService.modeDescription()"
    >
      <span class="material-symbols-rounded theme-icon" [class.is-dark]="themeService.isDark()">
        {{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}
      </span>
      <span
        class="theme-beta-badge"
        [class.is-auto]="themeService.preference() === 'auto'"
        [class.is-dark-mode]="themeService.preference() === 'dark'"
        [class.is-light-mode]="themeService.preference() === 'light'"
      >
        {{ themeService.preference() === 'auto' ? 'Auto' : (themeService.isDark() ? 'Dark' : 'Light') }}
      </span>
    </button>
  </div>

  <!-- Ambient Dynamic Mesh Background Gradients -->
  <div class="ambient-mesh-canvas">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="ambient-grid-overlay"></div>
  </div>

  <div class="login-main-stage">
    <div class="auth-panel-wrapper">
      <div class="modern-auth-card">

        <!-- Card Header Branding -->
        <div class="auth-card-header">
          <div class="showcase-emblem">
            <span class="material-symbols-rounded emblem-icon">school</span>
          </div>

          <h1 class="showcase-headline">ระบบจัดตารางสอน</h1>
          <div class="headline-gradient">Smart Timetable Scheduling</div>

          <div class="auth-brand-badge">
            <span class="material-symbols-rounded">verified_user</span>
            <span>ระบบยืนยันตัวตน สวป. (Microsoft 365)</span>
          </div>
        </div>

        <!-- Error Alert Message -->
        @if (errorMessage()) {
          <div class="modern-alert-error" role="alert">
            <span class="material-symbols-rounded alert-icon">error</span>
            <div class="alert-content">
              <strong>ไม่สามารถเข้าสู่ระบบได้</strong>
              <p>{{ errorMessage() }}</p>
            </div>
          </div>
        }

        <!-- Login Form -->
        <form class="auth-form" (ngSubmit)="onSubmit()">

          <!-- Email Input Field -->
          <div class="auth-input-group">
            <label class="auth-label" for="login-email">
              <span>ชื่อผู้ใช้งาน / อีเมลมหาวิทยาลัย</span>
            </label>
            <div class="auth-input-box">
              <span class="material-symbols-rounded input-leading-icon">account_circle</span>
              <input
                id="login-email"
                type="text"
                class="auth-text-input"
                placeholder="ระบุชื่อบัญชี (เช่น dev07)"
                [ngModel]="email()"
                (ngModelChange)="onEmailChange($event)"
                name="email"
                required
                autocomplete="username"
              />
              <span class="email-domain-pill">&#64;ru.ac.th</span>
            </div>
            <span class="field-hint">พิมพ์เฉพาะชื่อผู้ใช้ได้ ระบบจะเติม &#64;ru.ac.th ให้โดยอัตโนมัติ</span>
          </div>

          <!-- Password Input Field -->
          <div class="auth-input-group">
            <label class="auth-label" for="login-password">
              <span>รหัสผ่าน Microsoft 365</span>
            </label>
            <div class="auth-input-box">
              <span class="material-symbols-rounded input-leading-icon">key</span>
              <input
                id="login-password"
                [type]="showPassword() ? 'text' : 'password'"
                class="auth-text-input"
                placeholder="ระบุรหัสผ่านของคุณ"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                name="password"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="btn-password-visibility"
                (click)="togglePasswordVisibility()"
                [title]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'"
                tabindex="-1"
              >
                <span class="material-symbols-rounded">
                  {{ showPassword() ? 'visibility_off' : 'visibility' }}
                </span>
              </button>
            </div>
          </div>

          <!-- Sign In Submit Button (Icon Only) -->
          <button
            type="submit"
            class="btn-modern-login btn-arrow-only"
            [disabled]="isLoading()"
            title="เข้าสู่ระบบ"
            aria-label="เข้าสู่ระบบ"
          >
            @if (isLoading()) {
              <span class="material-symbols-rounded spin-icon">sync</span>
            } @else {
              <span class="material-symbols-rounded arrow-icon">arrow_forward</span>
            }
          </button>

        </form>

      </div>
    </div>

  </div>

</div>

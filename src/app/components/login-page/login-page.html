<div class="login-wrapper">

  <!-- Subtle ambient background effects -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <!-- Modern Clean Glass Card -->
  <div class="login-card">

    <!-- Card Header / Title -->
    <div class="card-header">
      <div class="brand-badge-pill">
        <span class="material-symbols-rounded brand-icon">school</span>
        <span>สำนักบริการทางวิชาการและทดสอบประเมินผล (สวป.) มหาวิทยาลัยรามคำแหง</span>
      </div>

      <h1 class="system-title">ระบบจัดตารางสอน<br><span class="title-accent">สำนักบริการทางวิชาการและทดสอบประเมินผล</span></h1>
      <p class="system-subtitle">เข้าสู่ระบบด้วยบัญชีอีเมลมหาวิทยาลัย (Microsoft 365)</p>
    </div>

    <!-- Error Alert Message -->
    @if (errorMessage()) {
      <div class="alert-error" role="alert">
        <span class="material-symbols-rounded alert-icon">error</span>
        <span class="alert-text">{{ errorMessage() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form class="login-form" (ngSubmit)="onSubmit()">

      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label" for="login-email">อีเมลผู้ใช้งาน</label>
        <div class="input-container">
          <span class="material-symbols-rounded input-icon">mail</span>
          <input
            id="login-email"
            type="email"
            class="form-control"
            placeholder="เช่น dev07@ru.ac.th"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="login-password">รหัสผ่าน</label>
        <div class="input-container">
          <span class="material-symbols-rounded input-icon">lock</span>
          <input
            id="login-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            placeholder="รหัสผ่าน Microsoft 365"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-view"
            (click)="togglePasswordVisibility()"
            [title]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'"
            tabindex="-1"
          >
            <span class="material-symbols-rounded">
              {{ showPassword() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <!-- Quick Fill Test Account Button -->
      <div class="quick-action-row">
        <button type="button" class="btn-preset-link" (click)="fillTestAccount()">
          <span class="material-symbols-rounded">touch_app</span>
          <span>ใช้บัญชีทดสอบ (dev07@ru.ac.th)</span>
        </button>
      </div>

      <!-- Sign In Submit Button -->
      <button
        type="submit"
        class="btn-submit-login"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span class="material-symbols-rounded spin-icon">sync</span>
          <span>กำลังเข้าสู่ระบบ...</span>
        } @else {
          <span class="material-symbols-rounded">login</span>
          <span>เข้าสู่ระบบ</span>
        }
      </button>

    </form>

  </div>

</div>
